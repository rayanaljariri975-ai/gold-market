name: Extract GOLD MARKET

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/gold-market
          unzip -o GOLD-MARKET-project-1.zip -d /tmp/gold-market
          cp -a /tmp/gold-market/. .

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract GOLD MARKET project"
            git push
          fi
